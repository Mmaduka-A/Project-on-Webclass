<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <body>
        <div class="container">
            <!-- LEFT SIDE -->
            <div class="left">
                <div class="logo"><i class="fa-solid fa-chart-simple"></i> Dashboard</div>
                <div class="left-content">
                    <h1>Get Started<br>With Your<br><span>Account</span></h1>
                    <p>Create your account and take the<br>first step towards smarter<br>business management.</p>
                </div>
                <div class="bottom-text">Already have an account? <a href="#">Log In →</a></div>

                <!-- Orange shapes - decoration -->
                <div class="circle c1"></div>
                <div class="circle c2"></div>
                <div class="circle c3"></div>
                <div class="blob"></div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="right">
                <div class="step-badge">Step 1 of 1</div>
                <h2>Create Your Account</h2>
                <p class="subtitle">Fill in your details to get started.</p>

                <form>
                    <label>Full Name<span>*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="Enter your full name">
                    </div>

                    <label>Email Address<span>*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-paper-plane"></i>
                        <input type="email" placeholder="Enter your Email Address">
                    </div>

                    <label>Phone Number<span>*</span></label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" placeholder="Enter your Phone Number">
                    </div>

                    <div class="terms">
                        <input type="checkbox" id="terms">
                        <label for="terms">I agree to the <a href="#">Terms & Condition</a> and <a href="#">Privacy
                                Policy</a></label>
                    </div>

                    <button type="submit" class="create-btn">Create Account →</button>

                    <div class="divider">or continue with</div>

                    <div class="socials">
                        <button type="button"><i class="fa-brands fa-google"></i> Google</button>
                        <button type="button"><i class="fa-brands fa-facebook"></i> Facebook</button>
                        <button type="button"><i class="fa-brands fa-apple"></i> Apple</button>
                    </div>
                </form>
            </div>
        </div>
    </body>

</html>
</body>

</html>
